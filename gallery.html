<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="gallery.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Isometra&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <title>Gallery</title>
  </head>
  <body>
    <header><h1>Gallery</h1></header>
    <main>
      <h2 id="">Some images and videos of planes that I like</h2>
      <div id="gallery-box">
        <section class="picture-box" id="F22">
          <h3>F22</h3>
          <img
            src="./images/F22.jpg"
            alt="USAF F22 stealthfighter in flight with a blue sky in the backround "
          />
        </section>
        <section class="picture-box" id="F15">
          <h3>F15</h3>
          <img
            src="./images/F15.jpg"
            alt="USAF F15 fighterjet in flight with snowcovered mountains in the backround"
          />
        </section>
        <section class="picture-box" id="Rafale">
          <h3>Rafale</h3>
          <img
            src="./images/Rafale.jpg"
            alt=" Indian airforce Rafale taxing on the runway"
          />
        </section>
        <section class="picture-box" id="A320N">
          <h3>A320N</h3>
          <video
            src="./videos/14833232_640_360_30fps.mp4"
            loop
            autoplay
            controls
            muted
          ></video>
        </section>
      </div>
    </main>
    <footer>
      <section>
        <a href="index.html" id="home-link">Go home to the main page!</a>
      </section>
    </footer>
  </body>
</html>
